name: Fase 2 Pipeline (daily incremental)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC ogni giorno

permissions:
  contents: write

jobs:
  run-fase2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create daily raw batch (simulate new arrival)
        run: |
          export BATCH_DT="$(date +%F)"
          python scripts/create_batch_from_csv.py

      - name: Run Fase 2 pipeline (bronze->silver->gold)
        run: |
          python run_fase2_ci.py

      - name: Commit updated DuckDB (warehouse)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/warehouse.duckdb data_lake/raw || true
          git status

          # Se non ci sono cambiamenti, non fallire
          git diff --staged --quiet && echo "No changes to commit" && exit 0

          git commit -m "chore(fase2): scheduled pipeline update"
          git push
