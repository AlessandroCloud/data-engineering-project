name: Fase 2 Pipeline (Daily Incremental)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # ogni giorno alle 06:00 UTC

permissions:
  contents: write

jobs:
  fase2-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 0) Batch giornaliero coerente (YYYY-MM-DD)
      - name: Set batch date (YYYY-MM-DD)
        run: echo "BATCH_DT=$(date +%F)" >> $GITHUB_ENV

      # 1) Genera il batch del giorno nel Data Lake (dt=YYYY-MM-DD)
      - name: Generate synthetic season batch (Data Lake)
        env:
          BATCH_DT: ${{ env.BATCH_DT }}
          BASE_YEAR: "2020"
        run: |
          python scripts/generate_synthetic_season_batch.py

      # 2) Pipeline end-to-end (bronze -> silver -> gold)
      - name: Run Fase 2 pipeline (bronze → silver → gold)
        run: |
          python run_fase2_ci.py

      # 3) Commit DB + batch del Data Lake
      - name: Commit updated warehouse and data lake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/warehouse.duckdb data_lake/raw data_lake/_metadata || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(fase2): scheduled pipeline update"
            git push
          fi
