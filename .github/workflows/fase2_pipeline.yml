name: Fase 2 Pipeline (Daily Incremental)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # ogni giorno alle 06:00 UTC

permissions:
  contents: write

jobs:
  fase2-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1) Simula arrivo dati "realistico" per F1:
      #    invece di inventare nuove race storiche, genera una NUOVA STAGIONE sintetica
      - name: Generate synthetic season batch (Data Lake)
        env:
          # batch id univoco per run -> evita che il ledger blocchi rerun nello stesso giorno
          BATCH_DT: ${{ github.run_id }}-${{ github.run_attempt }}
          # stagione di riferimento da clonare (stesso numero gare + piloti)
          BASE_YEAR: "2020"
        run: |
          python scripts/generate_synthetic_season_batch.py

      # 2) Pipeline end-to-end (bronze -> silver -> gold)
      - name: Run Fase 2 pipeline (bronze → silver → gold)
        run: |
          python run_fase2_ci.py

      # 3) Commit DB + nuovi batch del Data Lake
      - name: Commit updated warehouse and data lake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/warehouse.duckdb data_lake/raw || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(fase2): scheduled pipeline update"
            git push
          fi
