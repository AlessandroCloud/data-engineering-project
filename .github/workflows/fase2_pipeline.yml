name: Fase 2 Pipeline (Daily Incremental)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run"
        required: true
        default: "fase-2"
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  fase2-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (fase-2)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'fase-2' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic season batch (Data Lake)
        env:
          BATCH_DT: ${{ github.run_id }}-${{ github.run_attempt }}
          BASE_YEAR: "2020"
        run: |
          python scripts/generate_synthetic_season_batch.py

      - name: Run Fase 2 pipeline (bronze → silver → gold)
        run: |
          python run_fase2_ci.py

      - name: Commit updated warehouse and data lake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/warehouse.duckdb data_lake/raw || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(fase2): scheduled pipeline update"
            git push
          fi
