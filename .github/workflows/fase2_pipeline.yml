name: Fase 2 Pipeline (Daily Incremental)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # ogni giorno alle 06:00 UTC

permissions:
  contents: write

jobs:
  fase2-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Simulate daily data arrival
        run: |
          export BATCH_DT=$(date +%F)
          python scripts/create_batch_from_csv.py

      - name: Run Fase 2 pipeline (bronze → silver → gold)
        run: |
          python run_fase2_ci.py

      - name: Commit updated warehouse
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/warehouse.duckdb data_lake/raw || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(fase2): scheduled pipeline update"
            git push
          fi
